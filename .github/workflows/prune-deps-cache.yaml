name: Prune deps cache

# The deps cache overwrites its tag (ghcr.io/<repo>:deps-cache) on every export,
# and GitHub keeps the manifest that loses the tag as an untagged version forever.
# This removes exactly that - untagged versions of this repository's package,
# older than a week - and never the tag the CI build reads.
on:
  schedule:
    - cron: "17 4 * * 0" # Sundays, 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        default: true

concurrency:
  group: prune-deps-cache
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      # Scoped to one package of this owner, so no other image is touched: no
      # delete-tags/keep-n-tagged rules, only untagged versions. exclude-tags
      # protects the live cache even if a rule were ever changed.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}
          exclude-tags: deps-cache
          delete-untagged: true
          older-than: 7 days
          # Scheduled runs really delete; a manual run only reports by default.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
