name: Deps cache

# Fills the registry cache that the CI build reads: the expensive, stable part of
# the firmware image (apt packages, the elf-size-analyze venv and the fetched
# LVGL/ETL sources). The build layers above COPY . change on every commit, so
# caching those in the Actions cache only evicted the useful layers - they are not
# exported here.
#
# Lives in the registry (not in the 10 GB Actions cache budget, which buildx was
# filling with a ~1.1 GB blob per commit) and is consumed with
# `cache-from: type=registry` in ci.yaml. Missing cache is not an error: the CI
# build then simply does the work itself.
on:
  push:
    paths:
      - "Dockerfile"
      - "cmake/deps.cmake"
      - "cmake/gcc-arm-none-eabi.cmake"
      - "docker/deps/CMakeLists.txt"
      - ".github/workflows/deps-cache.yaml"
  workflow_dispatch:

concurrency:
  group: deps-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # target "deps" = builder stage (toolchain, venv) + the fetched sources.
      # push: false - only the cache manifest goes to the registry, no image.
      - name: Export the deps cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deps
          push: false
          cache-from: type=gha,scope=deps-cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:deps-cache,mode=max
