name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: "Run Pre-Commit Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1
  artifacts:
    name: "Build Artifacts"
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # The build context excludes .git (229 MB), so the version string that
      # git_version.h carries is computed here and passed in as a build arg.
      - name: Compute firmware version
        id: version
        run: echo "value=$(git describe --tags --dirty --always)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Only the stable part of the image (toolchain, venv, fetched LVGL/ETL) is
      # cached, and it is exported from its own target: those layers only change
      # with the Dockerfile or cmake/deps.cmake, so an unchanged export writes no
      # new blobs. The firmware build below writes no cache at all - its layers
      # sit on top of COPY . and are new on every commit (~0.5-1 GB per run that
      # nothing ever read, plus 70-100 s of export time).
      - name: Build deps stage
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          target: deps
          cache-from: type=gha,scope=deps
          cache-to: type=gha,scope=deps,mode=max
      - name: Build
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          # Debug build for pull requests, Release build for main / tagged releases.
          build-args: |
            BUILD_PRESET=${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}
            FW_VERSION=${{ steps.version.outputs.value }}
          # No cache-to on purpose, see "Build deps stage" above.
          cache-from: type=gha,scope=deps
          outputs: type=local,dest=./out
      - name: Copy Artifacts
        run: |
          mkdir artifacts
          cp ./out/openmower-firmware.bin ./artifacts
          cp ./out/openmower-firmware.elf ./artifacts
          cp ./out/ram-info.html ./artifacts
          cp ./out/flash-info.html ./artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmower
          path: artifacts/
  tagged-release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: artifacts
    steps:
      - name: Download artifacts from build stage
        uses: actions/download-artifact@v4
        with:
          name: openmower
          path: artifacts
      - name: Compress release directory into a versioned ZIP file
        run: cd artifacts && zip -r "../fw-openmower-v2-${{ github.ref_name }}.zip" .
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: "fw-openmower-v2-${{ github.ref_name }}.zip"
