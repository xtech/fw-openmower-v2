name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: "Run Pre-Commit Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1
  artifacts:
    name: "Build Artifacts"
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry cache from .github/workflows/deps-cache.yaml is pulled from
      # the repo's GHCR namespace.
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # The build context excludes .git (229 MB), so the version string that
      # git_version.h carries is computed here and passed in as a build arg.
      - name: Compute firmware version
        id: version
        run: echo "value=$(git describe --tags --dirty --always)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Pulling the deps cache needs a login even for a public package, and a
      # missing cache is only a warning (see the cache-from below).
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          # Debug build for pull requests, Release build for main / tagged releases.
          build-args: |
            BUILD_PRESET=${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}
            FW_VERSION=${{ steps.version.outputs.value }}
          # The stable part (toolchain, venv, fetched LVGL/ETL) comes from the
          # registry cache built by .github/workflows/deps-cache.yaml. No cache-to
          # on purpose: the layers above COPY . are new on every commit, so
          # exporting them only filled the 10 GB Actions cache with ~1.1 GB per
          # run and evicted the entries that were actually reused.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:deps-cache
          outputs: type=local,dest=./out
      - name: Copy Artifacts
        run: |
          mkdir artifacts
          cp ./out/openmower-firmware.bin ./artifacts
          cp ./out/openmower-firmware.elf ./artifacts
          cp ./out/ram-info.html ./artifacts
          cp ./out/flash-info.html ./artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmower
          path: artifacts/
  tagged-release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: artifacts
    steps:
      - name: Download artifacts from build stage
        uses: actions/download-artifact@v4
        with:
          name: openmower
          path: artifacts
      - name: Compress release directory into a versioned ZIP file
        run: cd artifacts && zip -r "../fw-openmower-v2-${{ github.ref_name }}.zip" .
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: "fw-openmower-v2-${{ github.ref_name }}.zip"
